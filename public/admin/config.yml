backend:
  name: github
  repo: roshanjf-droid/roshan-travels
  branch: main

# Local development workflow flag
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "trips"
    label: "Travel Journal Entries"
    folder: "src/content/trips"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Dates", name: "dates", widget: "string" }
      - { 
          label: "Status", 
          name: "status", 
          widget: "select", 
          options: ["Completed", "Ongoing / Next", "Upcoming"] 
        }
      - { label: "Cover Photo", name: "coverImage", widget: "image", required: false }
      - { label: "Short Summary", name: "description", widget: "text" }
      - { label: "Journal Content", name: "body", widget: "markdown" }